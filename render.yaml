services:
  # The Backend Web Service (FastAPI)
  - type: web
    name: darukaa-backend
    env: python
    region: ohio
    buildCommand: "cd backend && pip install -r requirements.txt && alembic upgrade head"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: darukaa-db
          property: connectionString
      - key: APP_ENV
        value: "production"
      - key: FRONTEND_URL
        value: "https://darukaa.earth"
      - key: JWT_SECRET_KEY
        generateValue: true

  # The Frontend Static Site (Vite / React)
  - type: web
    name: darukaa-frontend
    env: static
    region: ohio
    buildCommand: "cd frontend && npm install --legacy-peer-deps && npm run build"
    staticPublishPath: "./frontend/dist"
    envVars:
      - key: VITE_MAPBOX_TOKEN
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: darukaa-db
    region: ohio
    # Render's native PostgreSQL doesn't support PostGIS trivially via the UI in all specs,
    # but when provisioned with PostGIS extensions available, Alembic will load it.
    plan: free
